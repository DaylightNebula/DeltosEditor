[package]
name = "deltos"
version = "0.1.0"
edition = "2024"

[dependencies]
anarchy = { path = "../../anarchy", features = ["glam"] }
gearbox = { path = "../../gearbox" }

log = "0.4"
# `std::time::Instant::now` panics on the web; this falls back to it everywhere else
web-time = "1.1.0"
uuid = { version = "1.29.0", features = ["v4", "v5"] }
winit = "0.30"

# uuid needs the browser's crypto for random IDs on the web
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.29.0", features = ["v4", "v5", "js"] }
